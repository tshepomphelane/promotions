global:
  scrape_interval: 5s
  scrape_timeout: 5s

rule_files:
- /etc/prometheus/rules/*.yml

scrape_configs:
- job_name: prometheus
  static_configs:
  - targets: [ "localhost:9090" ]

- job_name: promotion-api
  metrics_path: /metrics
  static_configs:
  - targets: [ "promotion-api:8000" ]

- job_name: fake-profile-api
  metrics_path: /metrics
  static_configs:
  - targets: [ "fake-profile-api:8001" ]
