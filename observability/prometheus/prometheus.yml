global:
  scrape_interval: 15s
  scrape_timeout: 5s

rule_files:
- /etc/prometheus/rules/*.yml

scrape_configs:
- job_name: prometheus
  static_configs:
  - targets: [ "localhost:9090" ]

- job_name: promotion-api
  metrics_path: /metrics
  sample_limit: 2000
  label_limit: 15
  label_value_length_limit: 100
  metric_relabel_configs:
  - source_labels: [ __name__ ]
    regex: python_gc_.*
    action: drop
  static_configs:
  - targets: [ "promotion-api:8000" ]

- job_name: fake-profile-api
  metrics_path: /metrics
  sample_limit: 2000
  label_limit: 15
  label_value_length_limit: 100
  metric_relabel_configs:
  - source_labels: [ __name__ ]
    regex: python_gc_.*
    action: drop
  static_configs:
  - targets: [ "fake-profile-api:8001" ]
