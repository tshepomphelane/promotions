name: golden-path-ci

on:
  workflow_call:
    inputs:
      service_name:
        type: string
        required: true
      service_path:
        type: string
        required: true
      slo_spec:
        type: string
        required: true
      rules_output:
        type: string
        required: true
      test_args:
        type: string
        default: "-q"
      environment:
        type: string
        default: "staging"

permissions:
    contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.service_path }}/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ${{ inputs.service_path }}
      - run: python -m pytest ${{ inputs.test_args }}
        working-directory: ${{ inputs.service_path }}

  policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SLO and runbook policy
        run: >
          python golden-path/pipeline/policy_gate.py
          --spec ${{ inputs.slo_spec }}
          --rules ${{ inputs.rules_output }}
      - name: Validate Prometheus rules
        run: >
          docker run --rm --entrypoint promtool -v "$PWD":/work
          prom/prometheus:v2.54.1
          check rules /work/${{ inputs.rules_output }}

  build-scan:
    needs: [test, policy-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ${{ inputs.service_name }}:${{ github.sha }} ${{ inputs.service_path }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.service_name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          
  deploy:
    needs: build-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (ephemeral compose environment)
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/customers/CUST-001/promotions
          curl -fsS http://localhost:8000/metrics | grep http_server_requests_total
      - name: Integration tests
        run: |
          pip install pytest httpx
          PROMOTION_API_URL=http://localhost:8000 \
          PROFILE_API_URL=http://localhost:8001 \
          python -m pytest -q ${{ inputs.service_path }}/tests/test_api_integration.py
      - name: Tear down
        if: always()
        run: docker compose down -v