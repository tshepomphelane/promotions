services:
  postgres:
    image: postgres:16-alpine
    container_name: promotion-postgres
    environment:
      POSTGRES_DB: promotions
      POSTGRES_USER: promotion
      POSTGRES_PASSWORD: promotion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promotion -d promotions"]
      interval: 5s
      timeout: 3s
      retries: 10

  fake-profile-api:
    build:
      context: ./services/fake-profile-api
    container_name: fake-profile-api
    environment:
      FAILURE_MODE: none
      DELAY_SECONDS: 3
      CONTROL_TOKEN: local-assessment-token
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      UVICORN_LOG_LEVEL: warning
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  promotion-api:
    build:
      context: ./services/promotion-api
    container_name: promotion-api
    environment:
      DATABASE_URL: postgresql+psycopg://promotion:promotion@postgres:5432/promotions
      PROFILE_SERVICE_URL: http://fake-profile-api:8001
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 0
      DB_POOL_TIMEOUT_SECONDS: 0.2
      RULES_CACHE_TTL_SECONDS: 30
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      UVICORN_LOG_LEVEL: warning
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      fake-profile-api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    build:
      context: ./observability/prometheus
    ports:
      - "19090:9090"
    depends_on:
      promotion-api:
        condition: service_healthy

  grafana:
    build:
      context: ./observability/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "13000:3000"
    depends_on:
      - prometheus
  
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    build:
      context: ./observability/otel-collector
    depends_on:
      - jaeger

volumes:
  postgres_data: